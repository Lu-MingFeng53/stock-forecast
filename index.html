const KEY_NAME = "who-page-key-" + P.salt.slice(0, 12);   // 盐值一变（重新加密），旧的记住就失效
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// 等密码页加载完再整页替换；加载中途 document.write 会把正文接在密码框后面，而不是替换（2026-11-02 踩坑）
const show = html => { const go = () => { document.open(); document.write(html); document.close(); };
  document.readyState === "complete" ? go() : window.addEventListener("load", go, {once: true}); };
async function decryptWith(rawKey){
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.data));
  return new TextDecoder().decode(plain);
}
async function deriveRaw(password){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter}, base, 256);
}
(async () => {   // 先试本机记住的钥匙
  try {
    const saved = JSON.parse(localStorage.getItem(KEY_NAME) || "null");
    if (saved && saved.exp > Date.now()) { show(await decryptWith(b64(saved.k))); return; }
    localStorage.removeItem(KEY_NAME);
  } catch (_) {}
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "正在打开…"; err.textContent = "";
  try {
    const raw = await deriveRaw(document.getElementById("pw").value.trim());
    const html = await decryptWith(raw);
    if (document.getElementById("rem").checked) {
      try {
        const k = btoa(String.fromCharCode(...new Uint8Array(raw)));
        localStorage.setItem(KEY_NAME, JSON.stringify({k, exp: Date.now() + 30 * 864e5}));
      } catch (_) {}
    }
    show(html);
  } catch (_) {
    err.textContent = "密码不对，再试一次";
    go.disabled = false; go.textContent = "打开";
  }
});
})();
